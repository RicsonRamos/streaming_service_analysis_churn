[project]
name = "streaming-churn-prediction"
version = "3.0.0"
description = "Production-ready churn propensity engine with XGBoost, SHAP, and ROI simulation."
authors = [
    {name = "Ricson Ramos", email = "ricsonramos@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.4.0",
    "mlflow>=2.8.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "shap>=0.43.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "kagglehub>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0"
]
notebooks = [
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", ".venv", "mlruns", "data"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
